name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore Zazzo.ChoresWizard2000.sln

      - name: Build
        run: dotnet build Zazzo.ChoresWizard2000.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Zazzo.ChoresWizard2000.sln --configuration Release --no-build --verbosity normal
